[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe-monitor"
version = "2.0.0"
description = "Мониторинг средств индивидуальной защиты на видео"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3,<9",
    "opencv-python>=4.8",   # не headless: нужен cv2.imshow
    "numpy>=1.24",
    "requests>=2.31",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "lap>=0.5",             # нужен трекеру ByteTrack в ultralytics
]

[project.optional-dependencies]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]   # для моделей .onnx (на GPU — onnxruntime-gpu)
receiver = ["fastapi>=0.110", "pydantic>=2", "uvicorn>=0.29", "python-multipart>=0.0.9", "PyJWT>=2.10,<3", "Pillow>=10"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "jsonschema>=4.21", "ppe-monitor[receiver]"]

[project.scripts]
ppe-monitor = "ppe_monitor.cli:main"
ppe-receiver = "ppe_receiver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# Медленные системные тесты (реальные модели и ролики) — только по запросу: pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: системные тесты с реальными моделями и видео (десятки секунд)"]
